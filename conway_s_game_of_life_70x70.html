<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Conway's Game of Life — 70×70 Interactive Simulation</title>
  <style>
    /* Self-contained reset and utility styles for 100% offline execution (no CDNs) */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #090d16;
      color: #f8fafc;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .font-mono-code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    /* Layout & Canvas Container */
    #canvas-container {
      position: relative;
      flex: 1 1 0%;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    canvas.panning {
      cursor: grabbing !important;
    }

    /* Custom Range Slider Styling */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      background: #1e293b;
      height: 6px;
      border-radius: 999px;
      border: 1px solid #334155;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      margin-top: -6px;
      background-color: #10b981;
      height: 16px;
      width: 16px;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.6);
      transition: transform 0.15s ease, background-color 0.15s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
      background-color: #34d399;
    }

    input[type="range"]::-moz-range-track {
      background: #1e293b;
      height: 6px;
      border-radius: 999px;
      border: 1px solid #334155;
    }

    input[type="range"]::-moz-range-thumb {
      background-color: #10b981;
      height: 16px;
      width: 16px;
      border: none;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.6);
      transition: transform 0.15s ease, background-color 0.15s ease;
    }

    /* Glassmorphism panels */
    .glass-panel {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(51, 65, 85, 0.65);
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.6);
    }

    /* Subtle button press and glow transitions */
    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      outline: none;
    }

    .btn-control {
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-control:active {
      transform: scale(0.95);
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }

    /* Top Header */
    .top-header {
      position: fixed;
      top: 0.75rem;
      left: 0.75rem;
      right: 0.75rem;
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      pointer-events: none;
    }

    .brand-card {
      border-radius: 1rem;
      padding: 0.625rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      pointer-events: auto;
    }

    .status-dot {
      width: 0.75rem;
      height: 0.75rem;
      border-radius: 9999px;
      background-color: #34d399;
      box-shadow: 0 0 12px #34d399;
      animation: pulseGlow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 0.875rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: #f1f5f9;
      line-height: 1.25;
    }

    .brand-subtitle {
      font-size: 11px;
      color: #94a3b8;
    }

    .telemetry-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      pointer-events: auto;
    }

    .telemetry-card {
      border-radius: 1rem;
      padding: 0.5rem 0.875rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 0.75rem;
    }

    .stat-col {
      display: flex;
      flex-direction: column;
    }

    .stat-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      font-weight: 600;
    }

    .stat-val-emerald {
      font-weight: 700;
      color: #34d399;
      font-size: 0.875rem;
    }

    .stat-val-sky {
      font-weight: 700;
      color: #38bdf8;
      font-size: 0.875rem;
    }

    .stat-val-slate {
      font-weight: 600;
      color: #e2e8f0;
      font-size: 0.875rem;
    }

    .divider-v {
      height: 1.5rem;
      width: 1px;
      background-color: #334155;
    }

    .zoom-stat-wrapper,
    .zoom-divider {
      display: none;
    }

    .preset-card {
      border-radius: 1rem;
      padding: 0.5rem 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .preset-label {
      font-size: 0.75rem;
      color: #94a3b8;
      font-weight: 500;
      display: none;
    }

    .preset-select {
      font-family: inherit;
      background-color: rgba(30, 41, 59, 0.9);
      color: #e2e8f0;
      font-size: 0.75rem;
      border-radius: 0.75rem;
      padding: 0.375rem 0.625rem;
      border: 1px solid #334155;
      outline: none;
      cursor: pointer;
    }

    .preset-select:focus {
      border-color: #10b981;
    }

    /* Right Floating Camera Controls */
    .side-controls {
      position: fixed;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      padding: 0.5rem;
      border-radius: 1rem;
    }

    .icon-btn {
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 0.75rem;
      background-color: rgba(30, 41, 59, 0.9);
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(51, 65, 85, 0.8);
    }

    .icon-btn:hover {
      background-color: #334155;
    }

    .icon-btn.pan-active {
      background-color: #059669;
      color: #ffffff;
      border-color: #34d399;
    }

    .icon-btn.pan-active:hover {
      background-color: #10b981;
    }

    .divider-h {
      width: 100%;
      height: 1px;
      background-color: rgba(51, 65, 85, 0.8);
      margin: 0.125rem 0;
    }

    /* Bottom Control Dock */
    .bottom-dock {
      position: fixed;
      bottom: 0.75rem;
      left: 0.75rem;
      right: 0.75rem;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }

    .dock-panel {
      border-radius: 1rem;
      padding: 0.625rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      max-width: 56rem;
      width: 100%;
      pointer-events: auto;
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .action-btn {
      padding: 0.625rem 0.875rem;
      border-radius: 0.75rem;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.375rem;
    }

    .btn-play {
      padding-left: 1rem;
      padding-right: 1rem;
      background-color: #059669;
      color: #ffffff;
      font-weight: 600;
      gap: 0.5rem;
      box-shadow: 0 10px 15px -3px rgba(2, 44, 34, 0.5);
    }

    .btn-play:hover {
      background-color: #10b981;
    }

    .btn-play.is-playing {
      background-color: #d97706;
    }

    .btn-play.is-playing:hover {
      background-color: #f59e0b;
    }

    .btn-step {
      background-color: #1e293b;
      color: #f1f5f9;
      font-weight: 500;
      border: 1px solid #334155;
    }

    .btn-step:hover {
      background-color: #334155;
    }

    .btn-random {
      background-color: rgba(79, 70, 229, 0.9);
      color: #ffffff;
      font-weight: 500;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .btn-random:hover {
      background-color: #6366f1;
    }

    .btn-clear {
      background-color: rgba(225, 29, 72, 0.2);
      color: #fda4af;
      border: 1px solid rgba(244, 63, 94, 0.3);
      font-weight: 500;
    }

    .btn-clear:hover {
      background-color: rgba(225, 29, 72, 0.35);
    }

    .dock-divider-sm,
    .dock-divider-md {
      height: 1.5rem;
      width: 1px;
      background-color: rgba(51, 65, 85, 0.8);
      display: none;
    }

    /* Speed Control Box */
    .speed-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      background-color: rgba(15, 23, 42, 0.7);
      padding: 0.375rem 0.875rem;
      border-radius: 0.75rem;
      border: 1px solid #1e293b;
      width: 100%;
    }

    .speed-label-group {
      display: flex;
      align-items: center;
      gap: 0.375rem;
    }

    .speed-label {
      font-size: 0.75rem;
      font-weight: 500;
      color: #cbd5e1;
    }

    .speed-slider {
      width: 7rem;
    }

    .speed-val {
      font-size: 0.75rem;
      font-weight: 600;
      color: #34d399;
      width: 4.25rem;
      text-align: right;
    }

    .helper-hint {
      margin-top: 0.375rem;
      font-size: 11px;
      color: rgba(148, 163, 184, 0.9);
      background-color: rgba(2, 6, 23, 0.75);
      padding: 0.125rem 0.75rem;
      border-radius: 9999px;
      backdrop-filter: blur(4px);
      display: none;
    }

    /* Toast Notification */
    .toast-box {
      position: fixed;
      top: 5rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 500;
      color: #6ee7b7;
      border-color: rgba(16, 185, 129, 0.4);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .toast-box.visible {
      opacity: 1;
    }

    /* SVG Icons */
    .icon-sm {
      width: 1rem;
      height: 1rem;
      flex-shrink: 0;
    }

    .icon-md {
      width: 1.25rem;
      height: 1.25rem;
      flex-shrink: 0;
    }

    .text-sky { color: #38bdf8; }
    .text-amber { color: #fbbf24; }
    .hidden { display: none !important; }

    /* Responsive Breakpoints */
    @media (min-width: 640px) {
      .brand-title { font-size: 1rem; }
      .telemetry-card { font-size: 0.875rem; }
      .stat-val-emerald, .stat-val-sky { font-size: 1rem; }
      .zoom-stat-wrapper { display: flex; }
      .zoom-divider { display: block; }
      .preset-select { font-size: 0.875rem; }
      .dock-panel {
        padding: 0.75rem 1.25rem;
        gap: 1rem;
      }
      .action-btn { font-size: 0.875rem; }
      .dock-divider-sm { display: block; }
      .speed-box {
        width: auto;
        justify-content: flex-start;
      }
      .speed-slider { width: 8rem; }
      .helper-hint { display: block; }
    }

    @media (min-width: 768px) {
      .preset-label { display: inline; }
      .dock-divider-md { display: block; }
    }
  </style>
</head>
<body>

  <!-- Full-Viewport Interactive Simulation Canvas -->
  <div id="canvas-container">
    <canvas id="lifeCanvas"></canvas>
  </div>

  <!-- Top Header & Live Telemetry Bar -->
  <header class="top-header">
    <!-- Title & Rules Badge -->
    <div class="glass-panel brand-card">
      <div class="status-dot"></div>
      <div>
        <h1 class="brand-title">
          Conway’s Game of Life
        </h1>
        <p class="brand-subtitle font-mono-code">70 × 70 Bounded Grid · B3/S23</p>
      </div>
    </div>

    <!-- Telemetry Counters & Presets -->
    <div class="telemetry-group">
      <div class="glass-panel telemetry-card">
        <div class="stat-col">
          <span class="stat-label">Generation</span>
          <span id="genCount" class="font-mono-code stat-val-emerald">0</span>
        </div>
        <div class="divider-v"></div>
        <div class="stat-col">
          <span class="stat-label">Alive</span>
          <span id="aliveCount" class="font-mono-code stat-val-sky">0</span>
        </div>
        <div class="divider-v zoom-divider"></div>
        <div class="stat-col zoom-stat-wrapper">
          <span class="stat-label">Zoom</span>
          <span id="zoomDisplay" class="font-mono-code stat-val-slate">100%</span>
        </div>
      </div>

      <!-- Pattern Presets Dropdown -->
      <div class="glass-panel preset-card">
        <label for="presetSelect" class="preset-label">Seed:</label>
        <select id="presetSelect" class="preset-select">
          <option value="gosper">Gosper Glider Gun</option>
          <option value="pulsar">Pulsar Oscillator</option>
          <option value="rpentomino">R-Pentomino</option>
          <option value="acorn">Acorn Methuselah</option>
          <option value="gliders">Glider Fleet</option>
          <option value="random">Random Soup (30%)</option>
        </select>
      </div>
    </div>
  </header>

  <!-- Floating Zoom & Navigation Controls (Right Side) -->
  <div class="glass-panel side-controls">
    <button id="zoomInBtn" title="Zoom In (+)" class="btn-control icon-btn">
      <svg class="icon-md" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
      </svg>
    </button>
    <button id="zoomOutBtn" title="Zoom Out (-)" class="btn-control icon-btn">
      <svg class="icon-md" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M20 12H4" />
      </svg>
    </button>
    <div class="divider-h"></div>
    <button id="resetViewBtn" title="Center & Fit Grid (R)" class="btn-control icon-btn">
      <svg class="icon-md" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
      </svg>
    </button>
    <button id="panModeBtn" title="Toggle Pan Mode (or Right-Drag / Space+Drag)" class="btn-control icon-btn">
      <svg class="icon-md" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M7 11.5V14m0-2.5v-6a1.5 1.5 0 113 0m-3 6a1.5 1.5 0 00-3 0v2a7.5 7.5 0 0015 0v-5a1.5 1.5 0 00-3 0m-6-3V11m0-5.5v-1a1.5 1.5 0 013 0v1m0 0V11m0-5.5a1.5 1.5 0 013 0v3m0 0V11" />
      </svg>
    </button>
  </div>

  <!-- Bottom Control Dock -->
  <footer class="bottom-dock">
    <div class="glass-panel dock-panel">
      
      <!-- Primary Simulation Buttons -->
      <div class="btn-group">
        <!-- Auto-Play / Pause Button -->
        <button id="playPauseBtn" class="btn-control action-btn btn-play">
          <svg id="playIcon" class="icon-sm" fill="currentColor" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z" />
          </svg>
          <svg id="pauseIcon" class="icon-sm hidden" fill="currentColor" viewBox="0 0 24 24">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
          </svg>
          <span id="playPauseText">Auto-Play</span>
        </button>

        <!-- Step Single Generation Button -->
        <button id="stepBtn" class="btn-control action-btn btn-step">
          <svg class="icon-sm text-sky" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13 5l7 7-7 7M5 5l7 7-7 7" />
          </svg>
          <span>Step</span>
        </button>
      </div>

      <div class="dock-divider-sm"></div>

      <!-- Board Manipulation Buttons -->
      <div class="btn-group">
        <!-- Randomize Grid Button -->
        <button id="randomBtn" class="btn-control action-btn btn-random">
          <svg class="icon-sm" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
          <span>Randomize</span>
        </button>

        <!-- Clear Grid Button -->
        <button id="clearBtn" class="btn-control action-btn btn-clear">
          <svg class="icon-sm" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
          <span>Clear</span>
        </button>
      </div>

      <div class="dock-divider-md"></div>

      <!-- Simulation Speed Control -->
      <div class="speed-box">
        <div class="speed-label-group">
          <svg class="icon-sm text-amber" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
          <span class="speed-label">Speed:</span>
        </div>
        <input id="speedSlider" type="range" min="1" max="60" value="12" class="speed-slider" />
        <span id="speedValue" class="font-mono-code speed-val">12 gen/s</span>
      </div>

    </div>

    <!-- Subtle Helper Hint -->
    <div class="helper-hint">
      Click or drag to toggle tiles · Scroll or pinch to zoom · Right-drag, middle-drag, or toggle Hand tool to pan
    </div>
  </footer>

  <!-- Toast Notification Box (Replaces any alert() calls) -->
  <div id="toastBox" class="glass-panel toast-box">
    Notification
  </div>

  <script>
    /**
     * Conway's Game of Life — 70x70 Interactive Simulation
     * Architecture:
     * - Fixed 70x70 grid stored in typed arrays (Uint8Array) for ultra-fast double-buffered updates.
     * - Smooth 2D Canvas camera system supporting pan (offsetX, offsetY) and zoom (cellSize).
     * - Pointer & Touch unification supporting click/drag painting, right/middle-click panning,
     *   mouse wheel zoom-to-cursor, and two-finger pinch-to-zoom + pan on touch screens.
     */
    (function () {
      'use strict';

      // --- Constants & Configuration ---
      const GRID_SIZE = 70;
      const MIN_CELL_SIZE = 4;   // Minimum zoom level (pixels per cell)
      const MAX_CELL_SIZE = 64;  // Maximum zoom level (pixels per cell)
      const DEFAULT_CELL_SIZE = 12;

      // --- Simulation State ---
      let currentGrid = new Uint8Array(GRID_SIZE * GRID_SIZE);
      let nextGrid = new Uint8Array(GRID_SIZE * GRID_SIZE);
      let generation = 0;
      let aliveCount = 0;
      let isPlaying = false;
      let generationsPerSecond = 12;
      let lastStepTimestamp = 0;

      // --- Viewport & Camera State ---
      const canvas = document.getElementById('lifeCanvas');
      const ctx = canvas.getContext('2d', { alpha: false });
      const container = document.getElementById('canvas-container');

      let dpr = window.devicePixelRatio || 1;
      let viewportWidth = 0;
      let viewportHeight = 0;

      // Camera transform: top-left corner of the 70x70 board in CSS pixels, plus cell scale
      let cellSize = DEFAULT_CELL_SIZE;
      let offsetX = 0;
      let offsetY = 0;

      // --- Interaction State ---
      let isPanModeForced = false; // toggled via Hand button
      let isSpacePressed = false;
      let isPanning = false;
      let panStartX = 0;
      let panStartY = 0;
      let initialOffsetX = 0;
      let initialOffsetY = 0;

      let isDrawing = false;
      let drawTargetState = 1; // 1 = paint alive, 0 = erase
      let lastToggledIndex = -1;

      // Touch pinch state
      let activeTouches = new Map();
      let initialPinchDistance = 0;
      let initialPinchCellSize = DEFAULT_CELL_SIZE;
      let initialPinchMidpoint = { x: 0, y: 0 };

      // --- UI Elements ---
      const genCountEl = document.getElementById('genCount');
      const aliveCountEl = document.getElementById('aliveCount');
      const zoomDisplayEl = document.getElementById('zoomDisplay');
      const playPauseBtn = document.getElementById('playPauseBtn');
      const playPauseText = document.getElementById('playPauseText');
      const playIcon = document.getElementById('playIcon');
      const pauseIcon = document.getElementById('pauseIcon');
      const stepBtn = document.getElementById('stepBtn');
      const randomBtn = document.getElementById('randomBtn');
      const clearBtn = document.getElementById('clearBtn');
      const speedSlider = document.getElementById('speedSlider');
      const speedValue = document.getElementById('speedValue');
      const zoomInBtn = document.getElementById('zoomInBtn');
      const zoomOutBtn = document.getElementById('zoomOutBtn');
      const resetViewBtn = document.getElementById('resetViewBtn');
      const panModeBtn = document.getElementById('panModeBtn');
      const presetSelect = document.getElementById('presetSelect');
      const toastBox = document.getElementById('toastBox');

      let toastTimeout = null;
      function showToast(message) {
        toastBox.textContent = message;
        toastBox.classList.add('visible');
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
          toastBox.classList.remove('visible');
        }, 2000);
      }

      // --- Grid Helper Functions ---
      function getIndex(row, col) {
        return row * GRID_SIZE + col;
      }

      function countAliveCells() {
        let count = 0;
        for (let i = 0; i < currentGrid.length; i++) {
          count += currentGrid[i];
        }
        aliveCount = count;
        return count;
      }

      function updateTelemetryUI() {
        genCountEl.textContent = generation.toLocaleString();
        aliveCountEl.textContent = aliveCount.toLocaleString();
        const zoomPercent = Math.round((cellSize / DEFAULT_CELL_SIZE) * 100);
        zoomDisplayEl.textContent = `${zoomPercent}%`;
      }

      /**
       * Advances the simulation by one generation using standard Conway rules (B3/S23).
       * Bounded edges (cells outside 0..69 are considered dead).
       */
      function stepGeneration() {
        let newAlive = 0;

        for (let r = 0; r < GRID_SIZE; r++) {
          const rPrev = r - 1;
          const rNext = r + 1;
          const hasPrevRow = rPrev >= 0;
          const hasNextRow = rNext < GRID_SIZE;

          for (let c = 0; c < GRID_SIZE; c++) {
            const cPrev = c - 1;
            const cNext = c + 1;
            const hasPrevCol = cPrev >= 0;
            const hasNextCol = cNext < GRID_SIZE;

            let neighbors = 0;

            if (hasPrevRow) {
              if (hasPrevCol) neighbors += currentGrid[rPrev * GRID_SIZE + cPrev];
              neighbors += currentGrid[rPrev * GRID_SIZE + c];
              if (hasNextCol) neighbors += currentGrid[rPrev * GRID_SIZE + cNext];
            }

            if (hasPrevCol) neighbors += currentGrid[r * GRID_SIZE + cPrev];
            if (hasNextCol) neighbors += currentGrid[r * GRID_SIZE + cNext];

            if (hasNextRow) {
              if (hasPrevCol) neighbors += currentGrid[rNext * GRID_SIZE + cPrev];
              neighbors += currentGrid[rNext * GRID_SIZE + c];
              if (hasNextCol) neighbors += currentGrid[rNext * GRID_SIZE + cNext];
            }

            const idx = r * GRID_SIZE + c;
            const alive = currentGrid[idx];

            // Conway's Rules:
            // 1. Live cell with 2 or 3 live neighbors survives.
            // 2. Dead cell with exactly 3 live neighbors becomes alive.
            // 3. All other cells die or stay dead.
            let nextState = 0;
            if (alive === 1) {
              nextState = (neighbors === 2 || neighbors === 3) ? 1 : 0;
            } else {
              nextState = (neighbors === 3) ? 1 : 0;
            }

            nextGrid[idx] = nextState;
            newAlive += nextState;
          }
        }

        // Swap buffers
        const temp = currentGrid;
        currentGrid = nextGrid;
        nextGrid = temp;

        generation++;
        aliveCount = newAlive;
        updateTelemetryUI();
      }

      /**
       * Randomizes every tile on the 70x70 grid.
       */
      function randomizeGrid(density = 0.30) {
        let count = 0;
        for (let i = 0; i < currentGrid.length; i++) {
          const state = Math.random() < density ? 1 : 0;
          currentGrid[i] = state;
          count += state;
        }
        generation = 0;
        aliveCount = count;
        updateTelemetryUI();
      }

      /**
       * Clears all tiles on the 70x70 grid.
       */
      function clearGrid() {
        currentGrid.fill(0);
        generation = 0;
        aliveCount = 0;
        setPlaying(false);
        updateTelemetryUI();
      }

      /**
       * Loads famous Conway patterns onto the 70x70 grid.
       */
      function loadPreset(presetName) {
        currentGrid.fill(0);
        generation = 0;

        const setCell = (r, c) => {
          if (r >= 0 && r < GRID_SIZE && c >= 0 && c < GRID_SIZE) {
            currentGrid[getIndex(r, c)] = 1;
          }
        };

        if (presetName === 'random') {
          randomizeGrid(0.30);
          return;
        } else if (presetName === 'gosper') {
          // Gosper Glider Gun positioned near top-left so gliders travel across the 70x70 field
          const r0 = 8, c0 = 6;
          const coords = [
            [0,24],
            [1,22],[1,24],
            [2,12],[2,13],[2,20],[2,21],[2,34],[2,35],
            [3,11],[3,15],[3,20],[3,21],[3,34],[3,35],
            [4,0],[4,1],[4,10],[4,16],[4,20],[4,21],
            [5,0],[5,1],[5,10],[5,14],[5,16],[5,17],[5,22],[5,24],
            [6,10],[6,16],[6,24],
            [7,11],[7,15],
            [8,12],[8,13]
          ];
          coords.forEach(([dr, dc]) => setCell(r0 + dr, c0 + dc));
        } else if (presetName === 'pulsar') {
          // Period-3 Pulsar centered in the 70x70 grid
          const cr = 35, cc = 35;
          const offsets = [
            [-6,-4],[-6,-3],[-6,-2],[-6,2],[-6,3],[-6,4],
            [-4,-6],[-3,-6],[-2,-6],[-4,-1],[-3,-1],[-2,-1],
            [-4,1],[-3,1],[-2,1],[-4,6],[-3,6],[-2,6],
            [-1,-4],[-1,-3],[-1,-2],[-1,2],[-1,3],[-1,4],
            [1,-4],[1,-3],[1,-2],[1,2],[1,3],[1,4],
            [2,-6],[3,-6],[4,-6],[2,-1],[3,-1],[4,-1],
            [2,1],[3,1],[4,1],[2,6],[3,6],[4,6],
            [6,-4],[6,-3],[6,-2],[6,2],[6,3],[6,4]
          ];
          offsets.forEach(([dr, dc]) => setCell(cr + dr, cc + dc));
        } else if (presetName === 'rpentomino') {
          const cr = 34, cc = 34;
          [[0,1],[0,2],[1,0],[1,1],[2,1]].forEach(([dr, dc]) => setCell(cr + dr, cc + dc));
        } else if (presetName === 'acorn') {
          const cr = 35, cc = 32;
          [[0,1],[1,3],[2,0],[2,1],[2,4],[2,5],[2,6]].forEach(([dr, dc]) => setCell(cr + dr, cc + dc));
        } else if (presetName === 'gliders') {
          const glider = [[0,1],[1,2],[2,0],[2,1],[2,2]];
          for (let row = 6; row < 60; row += 14) {
            for (let col = 6; col < 60; col += 14) {
              glider.forEach(([dr, dc]) => setCell(row + dr, col + dc));
            }
          }
        }

        countAliveCells();
        updateTelemetryUI();
      }

      // --- Canvas Sizing & Camera Management ---
      function resizeCanvas() {
        try {
          const rect = container.getBoundingClientRect();
          viewportWidth = rect.width;
          viewportHeight = rect.height;
          dpr = window.devicePixelRatio || 1;

          canvas.width = Math.floor(viewportWidth * dpr);
          canvas.height = Math.floor(viewportHeight * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        } catch (err) {
          console.error('Canvas resize error:', err);
        }
      }

      function centerAndFitGrid() {
        const paddingX = 48;
        const paddingY = 165; // Leave comfortable room for top & bottom HUD bars
        const availW = Math.max(200, viewportWidth - paddingX);
        const availH = Math.max(200, viewportHeight - paddingY);

        const fitSize = Math.floor(Math.min(availW / GRID_SIZE, availH / GRID_SIZE));
        cellSize = Math.max(MIN_CELL_SIZE, Math.min(MAX_CELL_SIZE, fitSize));

        const boardPixelSize = GRID_SIZE * cellSize;
        offsetX = Math.floor((viewportWidth - boardPixelSize) / 2);
        offsetY = Math.floor((viewportHeight - boardPixelSize) / 2);
        updateTelemetryUI();
      }

      /**
       * Zooms smoothly around a specific screen anchor point (e.g., mouse cursor or canvas center).
       */
      function zoomAtPoint(factor, anchorX, anchorY) {
        const oldCellSize = cellSize;
        const newCellSize = Math.max(MIN_CELL_SIZE, Math.min(MAX_CELL_SIZE, oldCellSize * factor));
        if (Math.abs(newCellSize - oldCellSize) < 0.001) return;

        // Convert anchor screen point to world grid coordinates before zoom
        const worldX = (anchorX - offsetX) / oldCellSize;
        const worldY = (anchorY - offsetY) / oldCellSize;

        cellSize = newCellSize;

        // Recompute offset so the world coordinate stays pinned under the anchor point
        offsetX = anchorX - worldX * cellSize;
        offsetY = anchorY - worldY * cellSize;

        updateTelemetryUI();
      }

      /**
       * Converts screen coordinates (CSS pixels relative to canvas) to grid (row, col).
       * Returns null if outside the 70x70 bounds.
       */
      function screenToGrid(screenX, screenY) {
        const col = Math.floor((screenX - offsetX) / cellSize);
        const row = Math.floor((screenY - offsetY) / cellSize);
        if (row >= 0 && row < GRID_SIZE && col >= 0 && col < GRID_SIZE) {
          return { row, col };
        }
        return null;
      }

      // --- Rendering Engine ---
      function render() {
        // 1. Deep dark background outside the 70x70 board
        ctx.fillStyle = '#070b14';
        ctx.fillRect(0, 0, viewportWidth, viewportHeight);

        const boardSizePx = GRID_SIZE * cellSize;

        // 2. Subtle ambient glow behind the 70x70 board
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(offsetX, offsetY, boardSizePx, boardSizePx);

        // 3. Determine visible row/col bounds for fast culling when zoomed in
        const startCol = Math.max(0, Math.floor(-offsetX / cellSize));
        const endCol = Math.min(GRID_SIZE - 1, Math.ceil((viewportWidth - offsetX) / cellSize));
        const startRow = Math.max(0, Math.floor(-offsetY / cellSize));
        const endRow = Math.min(GRID_SIZE - 1, Math.ceil((viewportHeight - offsetY) / cellSize));

        // 4. Draw Live Cells
        const pad = cellSize >= 8 ? 1 : 0.25;
        const innerSize = Math.max(1, cellSize - pad * 2);

        ctx.fillStyle = '#10b981'; // Emerald-500 vibrant cell color
        for (let r = startRow; r <= endRow; r++) {
          const rowOffset = r * GRID_SIZE;
          const y = offsetY + r * cellSize + pad;
          for (let c = startCol; c <= endCol; c++) {
            if (currentGrid[rowOffset + c] === 1) {
              const x = offsetX + c * cellSize + pad;
              ctx.fillRect(x, y, innerSize, innerSize);
            }
          }
        }

        // 5. Draw Grid Lines (only when cells are large enough to avoid moire clutter)
        if (cellSize >= 6) {
          ctx.beginPath();
          ctx.strokeStyle = cellSize >= 12 ? 'rgba(51, 65, 85, 0.55)' : 'rgba(51, 65, 85, 0.28)';
          ctx.lineWidth = 1;

          for (let c = startCol; c <= endCol + 1; c++) {
            const x = Math.round(offsetX + c * cellSize) + 0.5;
            ctx.moveTo(x, Math.max(offsetY, offsetY + startRow * cellSize));
            ctx.lineTo(x, Math.min(offsetY + boardSizePx, offsetY + (endRow + 1) * cellSize));
          }

          for (let r = startRow; r <= endRow + 1; r++) {
            const y = Math.round(offsetY + r * cellSize) + 0.5;
            ctx.moveTo(Math.max(offsetX, offsetX + startCol * cellSize), y);
            ctx.lineTo(Math.min(offsetX + boardSizePx, offsetX + (endCol + 1) * cellSize), y);
          }
          ctx.stroke();
        }

        // 6. Highlight every 10th major grid line when zoomed in for spatial orientation
        if (cellSize >= 10) {
          ctx.beginPath();
          ctx.strokeStyle = 'rgba(148, 163, 184, 0.28)';
          ctx.lineWidth = 1;
          for (let i = 10; i < GRID_SIZE; i += 10) {
            const x = Math.round(offsetX + i * cellSize) + 0.5;
            const y = Math.round(offsetY + i * cellSize) + 0.5;
            ctx.moveTo(x, offsetY);
            ctx.lineTo(x, offsetY + boardSizePx);
            ctx.moveTo(offsetX, y);
            ctx.lineTo(offsetX + boardSizePx, y);
          }
          ctx.stroke();
        }

        // 7. Crisp Outer Boundary Frame around the 70x70 Grid
        ctx.strokeStyle = '#38bdf8'; // Sky-400 border
        ctx.lineWidth = 2;
        ctx.strokeRect(offsetX, offsetY, boardSizePx, boardSizePx);
      }

      // --- Main Animation Loop ---
      function mainLoop(timestamp) {
        if (isPlaying) {
          const intervalMs = 1000 / generationsPerSecond;
          if (timestamp - lastStepTimestamp >= intervalMs) {
            // Catch up at most 1 step per frame to keep UI ultra-responsive
            stepGeneration();
            lastStepTimestamp = timestamp;
          }
        }

        render();
        requestAnimationFrame(mainLoop);
      }

      // --- Playback Controls ---
      function setPlaying(state) {
        isPlaying = state;
        if (isPlaying) {
          lastStepTimestamp = performance.now();
          playPauseBtn.classList.add('is-playing');
          playPauseText.textContent = 'Pause';
          playIcon.classList.add('hidden');
          pauseIcon.classList.remove('hidden');
        } else {
          playPauseBtn.classList.remove('is-playing');
          playPauseText.textContent = 'Auto-Play';
          playIcon.classList.remove('hidden');
          pauseIcon.classList.add('hidden');
        }
      }

      function togglePanMode() {
        isPanModeForced = !isPanModeForced;
        if (isPanModeForced) {
          panModeBtn.classList.add('pan-active');
          canvas.style.cursor = 'grab';
          showToast('Pan Tool Active — Drag anywhere to move view');
        } else {
          panModeBtn.classList.remove('pan-active');
          canvas.style.cursor = 'crosshair';
          showToast('Draw Tool Active — Click or drag tiles to toggle');
        }
      }

      // --- Mouse & Touch Event Handlers ---
      canvas.addEventListener('contextmenu', (e) => e.preventDefault());

      canvas.addEventListener('mousedown', (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        // Right-click (2), Middle-click (1), Spacebar held, or Pan Mode active => Pan
        if (e.button === 1 || e.button === 2 || isSpacePressed || isPanModeForced) {
          isPanning = true;
          panStartX = x;
          panStartY = y;
          initialOffsetX = offsetX;
          initialOffsetY = offsetY;
          canvas.classList.add('panning');
          return;
        }

        // Left-click (0) => Toggle / Paint cells
        if (e.button === 0) {
          const cell = screenToGrid(x, y);
          if (cell) {
            isDrawing = true;
            const idx = getIndex(cell.row, cell.col);
            // Determine whether this drag stroke is activating or deactivating tiles
            drawTargetState = currentGrid[idx] === 1 ? 0 : 1;
            currentGrid[idx] = drawTargetState;
            lastToggledIndex = idx;
            countAliveCells();
            updateTelemetryUI();
          } else {
            // Clicking outside the 70x70 board conveniently allows panning
            isPanning = true;
            panStartX = x;
            panStartY = y;
            initialOffsetX = offsetX;
            initialOffsetY = offsetY;
            canvas.classList.add('panning');
          }
        }
      });

      window.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        if (isPanning) {
          offsetX = initialOffsetX + (x - panStartX);
          offsetY = initialOffsetY + (y - panStartY);
          return;
        }

        if (isDrawing) {
          const cell = screenToGrid(x, y);
          if (cell) {
            const idx = getIndex(cell.row, cell.col);
            if (idx !== lastToggledIndex) {
              currentGrid[idx] = drawTargetState;
              lastToggledIndex = idx;
              countAliveCells();
              updateTelemetryUI();
            }
          }
        }
      });

      window.addEventListener('mouseup', () => {
        isPanning = false;
        isDrawing = false;
        lastToggledIndex = -1;
        canvas.classList.remove('panning');
      });

      // Mouse Wheel Zoom anchored to cursor position
      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const zoomFactor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
        zoomAtPoint(zoomFactor, x, y);
      }, { passive: false });

      // --- Touch Gestures (Single-finger draw/pan + Two-finger pinch-zoom & pan) ---
      function getTouchDistance(t1, t2) {
        const dx = t2.clientX - t1.clientX;
        const dy = t2.clientY - t1.clientY;
        return Math.hypot(dx, dy);
      }

      function getTouchMidpoint(t1, t2, rect) {
        return {
          x: ((t1.clientX + t2.clientX) / 2) - rect.left,
          y: ((t1.clientY + t2.clientY) / 2) - rect.top
        };
      }

      canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();

        for (let i = 0; i < e.changedTouches.length; i++) {
          const t = e.changedTouches[i];
          activeTouches.set(t.identifier, t);
        }

        if (activeTouches.size === 1) {
          const t = Array.from(activeTouches.values())[0];
          const x = t.clientX - rect.left;
          const y = t.clientY - rect.top;

          if (isPanModeForced) {
            isPanning = true;
            panStartX = x;
            panStartY = y;
            initialOffsetX = offsetX;
            initialOffsetY = offsetY;
          } else {
            const cell = screenToGrid(x, y);
            if (cell) {
              isDrawing = true;
              const idx = getIndex(cell.row, cell.col);
              drawTargetState = currentGrid[idx] === 1 ? 0 : 1;
              currentGrid[idx] = drawTargetState;
              lastToggledIndex = idx;
              countAliveCells();
              updateTelemetryUI();
            } else {
              isPanning = true;
              panStartX = x;
              panStartY = y;
              initialOffsetX = offsetX;
              initialOffsetY = offsetY;
            }
          }
        } else if (activeTouches.size === 2) {
          // Cancel single-finger drawing and switch to two-finger pinch/pan
          isDrawing = false;
          isPanning = false;
          const [t1, t2] = Array.from(activeTouches.values());
          initialPinchDistance = getTouchDistance(t1, t2);
          initialPinchCellSize = cellSize;
          initialPinchMidpoint = getTouchMidpoint(t1, t2, rect);
          initialOffsetX = offsetX;
          initialOffsetY = offsetY;
        }
      }, { passive: false });

      canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();

        for (let i = 0; i < e.changedTouches.length; i++) {
          const t = e.changedTouches[i];
          activeTouches.set(t.identifier, t);
        }

        if (activeTouches.size === 1) {
          const t = Array.from(activeTouches.values())[0];
          const x = t.clientX - rect.left;
          const y = t.clientY - rect.top;

          if (isPanning) {
            offsetX = initialOffsetX + (x - panStartX);
            offsetY = initialOffsetY + (y - panStartY);
          } else if (isDrawing) {
            const cell = screenToGrid(x, y);
            if (cell) {
              const idx = getIndex(cell.row, cell.col);
              if (idx !== lastToggledIndex) {
                currentGrid[idx] = drawTargetState;
                lastToggledIndex = idx;
                countAliveCells();
                updateTelemetryUI();
              }
            }
          }
        } else if (activeTouches.size === 2 && initialPinchDistance > 0) {
          const [t1, t2] = Array.from(activeTouches.values());
          const currentDist = getTouchDistance(t1, t2);
          const currentMid = getTouchMidpoint(t1, t2, rect);

          const scaleRatio = currentDist / initialPinchDistance;
          const newCellSize = Math.max(MIN_CELL_SIZE, Math.min(MAX_CELL_SIZE, initialPinchCellSize * scaleRatio));

          // Anchor world point under initial midpoint and follow moving midpoint
          const worldX = (initialPinchMidpoint.x - initialOffsetX) / initialPinchCellSize;
          const worldY = (initialPinchMidpoint.y - initialOffsetY) / initialPinchCellSize;

          cellSize = newCellSize;
          offsetX = currentMid.x - worldX * cellSize;
          offsetY = currentMid.y - worldY * cellSize;
          updateTelemetryUI();
        }
      }, { passive: false });

      canvas.addEventListener('touchend', (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) {
          activeTouches.delete(e.changedTouches[i].identifier);
        }
        if (activeTouches.size === 0) {
          isDrawing = false;
          isPanning = false;
          lastToggledIndex = -1;
          initialPinchDistance = 0;
        }
      });

      // --- UI Button & Keyboard Wiring ---
      playPauseBtn.addEventListener('click', () => setPlaying(!isPlaying));

      stepBtn.addEventListener('click', () => {
        if (isPlaying) setPlaying(false);
        stepGeneration();
      });

      randomBtn.addEventListener('click', () => {
        randomizeGrid(0.30);
        showToast('Randomized all 4,900 tiles (30% density)');
      });

      clearBtn.addEventListener('click', () => {
        clearGrid();
        showToast('Grid cleared');
      });

      speedSlider.addEventListener('input', (e) => {
        generationsPerSecond = parseInt(e.target.value, 10);
        speedValue.textContent = `${generationsPerSecond} gen/s`;
      });

      zoomInBtn.addEventListener('click', () => {
        zoomAtPoint(1.25, viewportWidth / 2, viewportHeight / 2);
      });

      zoomOutBtn.addEventListener('click', () => {
        zoomAtPoint(1 / 1.25, viewportWidth / 2, viewportHeight / 2);
      });

      resetViewBtn.addEventListener('click', () => {
        centerAndFitGrid();
        showToast('View centered');
      });

      panModeBtn.addEventListener('click', togglePanMode);

      presetSelect.addEventListener('change', (e) => {
        setPlaying(false);
        loadPreset(e.target.value);
        showToast(`Loaded pattern: ${e.target.options[e.target.selectedIndex].text}`);
      });

      // Keyboard Shortcuts
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          if (!isSpacePressed) {
            isSpacePressed = true;
            canvas.style.cursor = 'grab';
          }
        } else if (e.key === 'p' || e.key === 'P') {
          setPlaying(!isPlaying);
        } else if (e.key === 's' || e.key === 'S' || e.key === 'ArrowRight') {
          if (isPlaying) setPlaying(false);
          stepGeneration();
        } else if (e.key === 'r' || e.key === 'R') {
          centerAndFitGrid();
        } else if (e.key === '=' || e.key === '+') {
          zoomAtPoint(1.2, viewportWidth / 2, viewportHeight / 2);
        } else if (e.key === '-' || e.key === '_') {
          zoomAtPoint(1 / 1.2, viewportWidth / 2, viewportHeight / 2);
        }
      });

      window.addEventListener('keyup', (e) => {
        if (e.code === 'Space') {
          isSpacePressed = false;
          canvas.style.cursor = isPanModeForced ? 'grab' : 'crosshair';
        }
      });

      window.addEventListener('resize', () => {
        resizeCanvas();
      });

      // --- Initialization on Window Load ---
      window.onload = function () {
        resizeCanvas();
        loadPreset('gosper');
        centerAndFitGrid();
        requestAnimationFrame(mainLoop);
      };
    })();
  </script>
</body>
</html>
